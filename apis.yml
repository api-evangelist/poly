name: Poly
description: Poly is an AI-powered intelligent cloud file browser that syncs a user's
  local files to the cloud and layers an AI agent over them, letting people search by
  image, concept, phrase, color or face and ask natural-language questions about their
  documents, images, video and audio to get summaries, transcriptions, tags and generated
  content such as podcasts and presentations. Founded by CEO Abhay Agarwal, Poly (formerly
  reached at withpoly.com, now poly.app) emerged from stealth in November 2025 with $8M
  in seed funding led by Felicis with participation from Bloomberg Beta, NextView, Figma
  Ventures, AI Grant, Wing Ventures and MVP Ventures. It is currently in waitlist/beta on
  web and Mac, with a Windows version planned, and as of this enrichment pass publishes no
  public developer API, SDKs, CLI, or MCP server.
